name: QA Regression

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      repo:
        description: Dev app repo owner/name
        required: false
        default: ksiddu/sample_dev_app
      ref:
        description: Dev app branch or commit SHA
        required: false
        default: master
      app_url:
        description: Optional deployed app URL
        required: false
        default: ""
      marker_expression:
        description: Pytest marker expression
        required: false
        default: regression
      expected_title:
        description: Expected page title
        required: false
        default: Sample Dev App
      expected_heading:
        description: Expected page heading
        required: false
        default: Sample Dev App
      post_status:
        description: Post qa/regression status back to the dev repo commit
        required: false
        default: "false"

env:
  DEFAULT_DEV_REPO: ksiddu/sample_dev_app
  DEFAULT_DEV_REF: master
  DEFAULT_MARKER_EXPRESSION: regression
  DEFAULT_APP_TITLE: Sample Dev App
  DEFAULT_APP_HEADING: Sample Dev App
  DEFAULT_POST_STATUS: "true"

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DEV_REPO_STATUS_TOKEN: ${{ secrets.DEV_REPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps
      - id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "repo=${{ inputs.repo || env.DEFAULT_DEV_REPO }}" >> $GITHUB_OUTPUT
            echo "ref=${{ inputs.ref || env.DEFAULT_DEV_REF }}" >> $GITHUB_OUTPUT
            echo "app_url=${{ inputs.app_url }}" >> $GITHUB_OUTPUT
            echo "marker_expression=${{ inputs.marker_expression || env.DEFAULT_MARKER_EXPRESSION }}" >> $GITHUB_OUTPUT
            echo "expected_title=${{ inputs.expected_title || env.DEFAULT_APP_TITLE }}" >> $GITHUB_OUTPUT
            echo "expected_heading=${{ inputs.expected_heading || env.DEFAULT_APP_HEADING }}" >> $GITHUB_OUTPUT
            echo "post_status=${{ inputs.post_status }}" >> $GITHUB_OUTPUT
          else
            echo "repo=${{ env.DEFAULT_DEV_REPO }}" >> $GITHUB_OUTPUT
            echo "ref=${{ env.DEFAULT_DEV_REF }}" >> $GITHUB_OUTPUT
            echo "app_url=" >> $GITHUB_OUTPUT
            echo "marker_expression=${{ env.DEFAULT_MARKER_EXPRESSION }}" >> $GITHUB_OUTPUT
            echo "expected_title=${{ env.DEFAULT_APP_TITLE }}" >> $GITHUB_OUTPUT
            echo "expected_heading=${{ env.DEFAULT_APP_HEADING }}" >> $GITHUB_OUTPUT
            echo "post_status=${{ env.DEFAULT_POST_STATUS }}" >> $GITHUB_OUTPUT
          fi
      - id: resolve_owner
        run: |
          echo "owner=$(echo '${{ steps.resolve.outputs.repo }}' | cut -d/ -f1)" >> $GITHUB_OUTPUT
          echo "name=$(echo '${{ steps.resolve.outputs.repo }}' | cut -d/ -f2)" >> $GITHUB_OUTPUT
      - name: Checkout dev app
        if: steps.resolve.outputs.app_url == ''
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.resolve.outputs.repo }}
          ref: ${{ steps.resolve.outputs.ref }}
          token: ${{ secrets.DEV_REPO_TOKEN || github.token }}
          path: dev_app
      - id: resolve_sha
        run: |
          if [ "${{ steps.resolve.outputs.app_url }}" = "" ]; then
            echo "sha=$(git -C dev_app rev-parse HEAD)" >> $GITHUB_OUTPUT
          else
            echo "sha=${{ steps.resolve.outputs.ref }}" >> $GITHUB_OUTPUT
          fi
      - name: Mark regression pending
        if: steps.resolve.outputs.post_status == 'true' && env.DEV_REPO_STATUS_TOKEN != ''
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.DEV_REPO_TOKEN }}
          script: |
            await github.rest.repos.createCommitStatus({
              owner: "${{ steps.resolve_owner.outputs.owner }}",
              repo: "${{ steps.resolve_owner.outputs.name }}",
              sha: "${{ steps.resolve_sha.outputs.sha }}",
              state: "pending",
              context: "qa/regression",
              description: "QA regression is running",
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            })
      - name: Start dev app
        if: steps.resolve.outputs.app_url == ''
        run: |
          python -m http.server 8000 --directory dev_app/app > /tmp/devserver.log 2>&1 &
          sleep 2
      - id: regression_tests
        name: Run regression tests
        continue-on-error: true
        env:
          APP_URL: ${{ steps.resolve.outputs.app_url != '' && steps.resolve.outputs.app_url || 'http://127.0.0.1:8000' }}
          APP_TITLE: ${{ steps.resolve.outputs.expected_title }}
          APP_HEADING: ${{ steps.resolve.outputs.expected_heading }}
          PYTEST_MARKER: ${{ steps.resolve.outputs.marker_expression }}
        run: |
          pytest -m "$PYTEST_MARKER" --html=artifacts/report.html --self-contained-html --alluredir=artifacts/allure
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-artifacts
          path: artifacts
      - name: Mark regression success
        if: steps.resolve.outputs.post_status == 'true' && env.DEV_REPO_STATUS_TOKEN != '' && steps.regression_tests.outcome == 'success'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.DEV_REPO_TOKEN }}
          script: |
            await github.rest.repos.createCommitStatus({
              owner: "${{ steps.resolve_owner.outputs.owner }}",
              repo: "${{ steps.resolve_owner.outputs.name }}",
              sha: "${{ steps.resolve_sha.outputs.sha }}",
              state: "success",
              context: "qa/regression",
              description: "QA regression passed",
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            })
      - name: Mark regression failure
        if: steps.resolve.outputs.post_status == 'true' && env.DEV_REPO_STATUS_TOKEN != '' && steps.regression_tests.outcome != 'success'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.DEV_REPO_TOKEN }}
          script: |
            await github.rest.repos.createCommitStatus({
              owner: "${{ steps.resolve_owner.outputs.owner }}",
              repo: "${{ steps.resolve_owner.outputs.name }}",
              sha: "${{ steps.resolve_sha.outputs.sha }}",
              state: "failure",
              context: "qa/regression",
              description: "QA regression failed",
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            })
      - name: Fail workflow if regression failed
        if: steps.regression_tests.outcome != 'success'
        run: exit 1
